# HINT semantic plan — the static prior the mission_planner starts from.
#
# Environments are HARD RAILS: visited in order, never skipped or reordered. Each
# carries only a brief notion of *intent*, not concrete steps — the human<->LLM
# authoring keeps this short and describable. The live Narrative State
# (*.narrative.jsonl) evolves from here as the robot actually navigates; this file
# is only the initial belief.

mission: "Tidy the apartment: navigate to living room couch."

environments:
  - name: bedroom
    description: "A regular bedroom"
    intent: "Pass through the bedroom to the doorway leading into the living room, keeping to the open floor."
  - name: living_room
    description: "A regular living room"
    intent: "Enter the living room and stop on the floor in front of the couch."
